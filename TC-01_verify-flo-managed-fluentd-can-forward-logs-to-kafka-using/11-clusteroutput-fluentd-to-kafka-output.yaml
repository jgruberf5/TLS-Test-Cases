---
apiVersion: logging.banzaicloud.io/v1beta1
kind: ClusterOutput
metadata:
  name: fluentd-to-kafka-output
  namespace: logging
spec:
  kafka:
    # Connect to Kafka SSL listener (port 9094)
    brokers: "kafka-cluster-kafka-bootstrap.kafka.svc.cluster.local:9094"
    default_topic: "kubernetes-logs"
    format:
      type: json
    buffer:
      tags: topic
      timekey: 10s
      timekey_wait: 2s
    # mTLS Configuration - reference certificates from secret
    ssl_ca_cert:
      mountFrom:
        secretKeyRef:
          name: toda-kafka-client-tls
          key: ca.crt
    ssl_client_cert:
      mountFrom:
        secretKeyRef:
          name: toda-kafka-client-tls
          key: tls.crt
    ssl_client_cert_key:
      mountFrom:
        secretKeyRef:
          name: toda-kafka-client-tls
          key: tls.key
    ssl_verify_hostname: false
