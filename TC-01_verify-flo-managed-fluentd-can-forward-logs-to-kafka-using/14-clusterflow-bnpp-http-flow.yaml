---
# ClusterFlow for BNPP HTTP Logs
# Routes Observer HTTP profile statistics to bnpp-http-logs topic
apiVersion: logging.banzaicloud.io/v1beta1
kind: ClusterFlow
metadata:
  name: bnpp-http-flow
  namespace: logging
spec:
  match:
    - select:
        labels:
          app: observer
          metric_type: profile_http_stat
  filters:
    # Parse JSON from Observer
    - parser:
        parse:
          type: json
        key_name: log
        reserve_data: true

    # Filter for HTTP metrics only
    - grep:
        regexp:
          - key: metric_name
            pattern: /^profile_http_stat\./

    # Add metadata
    - record_modifier:
        records:
          - source: "bnpp-observer"
            topic: "bnpp-http-logs"

  globalOutputRefs:
    - bnpp-http-to-kafka
