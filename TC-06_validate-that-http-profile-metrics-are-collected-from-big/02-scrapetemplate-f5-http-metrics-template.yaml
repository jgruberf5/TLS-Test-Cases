---
apiVersion: metrics.f5.net/v1alpha1
kind: ScrapeTemplate
metadata:
  name: f5-http-metrics-template
  namespace: f5-alpha
  labels:
    app: f5-http-metrics
    component: scrapetemplate
spec:
  scrapeClass: f5-http-metrics-class
  jobs:
  - name: http-profile-stats
    table: profile_http_stat
    every: 30s
    scrapeInterval: 28s
    aggregation: Aggregated
    metricNames:
      - f5.profile_http.requests
      - f5.profile_http.responses.2xx
      - f5.profile_http.responses.4xx
      - f5.profile_http.responses.5xx
  - name: virtual-server-stats
    table: virtual_server_stat
    every: 30s
    scrapeInterval: 28s
    aggregation: Aggregated
    metricNames:
      - f5.virtual_server.clientside.transmitted.packets
      - f5.virtual_server.clientside.received.packets
      - f5.virtual_server.clientside.transmitted.bytes
      - f5.virtual_server.clientside.received.bytes
      - f5.virtual_server.clientside.connections.current
      - f5.virtual_server.clientside.connections.count
